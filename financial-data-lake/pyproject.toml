[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-data-lake"
version = "0.1.0"
description = "Versioned, point-in-time financial data lake with entitlement registry, medallion Parquet layers, lineage, as-of queries, and deterministic recovery."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0,<2.0.0",
    "pyarrow>=17.0.0,<21.0.0",
    "pydantic>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.6.0,<1.0.0",
]

[project.scripts]
fdl = "financial_data_lake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
