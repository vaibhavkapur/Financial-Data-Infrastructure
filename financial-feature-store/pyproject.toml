[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-feature-store"
version = "0.1.0"
description = "Versioned causal financial feature store with point-in-time offline retrieval, online serving parity, freshness tracking, lineage, and quality gates."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0.0,<3.0.0",
    "pydantic>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "ruff>=0.6.0,<1.0.0",
]
redis = [
    "redis>=5.0.0,<6.0.0",
]
postgres = [
    "psycopg[binary]>=3.1.0,<4.0.0",
]

[project.scripts]
ffs = "financial_feature_store.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
