[build-system]
requires = ["setuptools>=58.0"]
build-backend = "setuptools.build_meta"

[project]
name = "security-master-platform"
version = "0.1.0"
description = "Bitemporal financial security master platform with conflict quarantine, as-of symbol lookup, corporate-action linkage, and reviewer workflow."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Trading Data Infrastructure Contributors" }
]
dependencies = []

[project.optional-dependencies]
fastapi = [
  "fastapi==0.115.0",
  "uvicorn==0.30.6",
  "pydantic==2.9.2",
]
postgres = [
  "psycopg[binary]==3.2.3",
]
dev = [
  "pytest==8.3.3",
]

[project.scripts]
sec-master = "sec_master.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
