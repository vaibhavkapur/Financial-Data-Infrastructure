[build-system]
requires = ["setuptools>=58.0"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-quant-research-platform"
version = "0.1.0"
description = "Reproducible, budgeted parallel quantitative research job runner on versioned datasets."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Trading-Data-Infrastructure Contributors"}
]
dependencies = []

[project.optional-dependencies]
parquet = [
    "pyarrow==20.0.0",
]
dask = [
    "dask==2025.2.0",
    "distributed==2025.2.0",
]
ray = [
    "ray==2.43.0",
]
postgres = [
    "psycopg[binary]==3.2.6",
]
dev = [
    "pytest==8.3.5",
]

[project.scripts]
dqrp = "dqrp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
