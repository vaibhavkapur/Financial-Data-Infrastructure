name: Distributed Tick Data Database CI

on:
  push:
    paths:
      - "distributed-tick-data-database/**"
      - ".github/workflows/distributed-tick-data-database.yml"
  pull_request:
    paths:
      - "distributed-tick-data-database/**"
      - ".github/workflows/distributed-tick-data-database.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: distributed-tick-data-database
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Vet and Build
        run: |
          go vet ./...
          go build -o bin/tickdb ./src/cmd/tickdb

      - name: Run Full Test Suite (Race Detector)
        run: go test -v -race ./...

      - name: Run End-to-End Validation Script
        run: ./scripts/validate.sh
