[build-system]
requires = ["setuptools>=58.0"]
build-backend = "setuptools.build_meta"

[project]
name = "options-market-data-platform"
version = "0.1.0"
description = "Educational/research prototype for ingesting versioned option chains, validating quotes, deriving Black-Scholes implied volatility features with full provenance, and replaying historical snapshots."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
analytics = [
    "polars==1.9.0",
]
postgres = [
    "psycopg[binary]==3.2.3",
]
dev = [
    "pytest==8.3.3",
]

[project.scripts]
omdp = "omdp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
